# Shared workflow for destination launches.
#
# Record layer today: launches/{slug}/ (epic.md + tasks/*.md) — see FILES-MODEL.md
# Record layer target: Jira Epic + child issues — see JIRA-MODEL.md
#
# Orchestrator reads: checklist, deps, jira_title, summary.
# Child agents read step SKILL.md — NOT this file for domain work.
#
# summary: human-facing precis for checklist — NOT the execution spec.
version: 2

steps:
  - id: release-ticket
    skill: release-ticket
    jira_title: Release ticket
    summary: >-
      Create the Release ticket first. All step Jira tickets and PR titles reference
      release.ticket_id from global context.
    depends_on: []
    repos: [agent-demo]

  - id: dist-types
    skill: dist-types
    jira_title: Dist types (Thrift schemas)
    summary: >-
      Add dist_types Thrift definitions — streaming format, endpoint config,
      taxonomy config, OAuth endpoint union. Bump codegen per repo convention.
    depends_on: [release-ticket]
    repos: [dist_types]

  - id: oauth
    skill: oauth
    jira_title: OAuth client and endpoint config
    summary: >-
      Implement OAuth in dist + dist_types — token URL, headers, metadata keys,
      client implementation, validation.
    depends_on: [dist-types]
    repos: [dist, dist_types]

  - id: taxonomy-deliverer
    skill: taxonomy-deliverer
    jira_title: Taxonomy on destination (code)
    summary: >-
      Taxonomy deliverer code in dist — partner taxonomy API, sync flow, headers,
      tests. This is the code step for taxonomy on the destination (not platform UI).
    depends_on: [dist-types, oauth]
    repos: [dist, dist_types]

  - id: partner-api-client
    skill: partner-api-client
    jira_title: Partner API client
    summary: >-
      Partner API client and constants in dist — base URLs, auth wiring,
      shared client utilities for streaming delivery.
    depends_on: [dist-types, oauth]
    repos: [dist, dist_types]

  - id: request-builder-sender
    skill: request-builder-sender
    jira_title: Request builder and sender
    summary: >-
      Request builder and request sender in dist — payload shape, operation
      types, send path, unit tests.
    depends_on: [partner-api-client]
    repos: [dist, dist_types]

  - id: transposer-record-handler
    skill: transposer-record-handler
    jira_title: Transposer, record handler, field selector
    summary: >-
      Transposer, record handler, relevant field selector, config wiring,
      destination-specific metrics for Grafana.
    depends_on: [request-builder-sender]
    repos: [dist, dist_types]

  - id: rlg-addition
    skill: rlg-addition
    jira_title: RLG (DB addition)
    summary: >-
      Add RLG record in platform DB. Runbook/SQL today; API when platform team
      ships it.
    depends_on: [release-ticket]
    repos: [agent-demo]

  - id: delivery-endpoints-ui
    skill: delivery-endpoints-ui
    jira_title: Delivery endpoints (UI)
    summary: >-
      Create delivery endpoints via platform UI. Textual runbook today; REST API
      when platform team ships it.
    depends_on: [rlg-addition, dist-types, oauth]
    repos: [agent-demo]

  - id: taxonomy-ui
    skill: taxonomy-ui
    jira_title: Taxonomy endpoints (UI)
    summary: >-
      Create taxonomy endpoint objects via platform UI. Textual runbook today;
      REST API when platform team ships it.
    depends_on: [taxonomy-deliverer]
    repos: [agent-demo]

  - id: ig-ui
    skill: ig-ui
    jira_title: Integration group (UI)
    summary: >-
      Create integration group via platform UI. Textual runbook today; REST API
      when platform team ships it. Wires delivery endpoints + taxonomy endpoints.
    depends_on: [delivery-endpoints-ui, taxonomy-ui]
    repos: [agent-demo]

  - id: da-ui
    skill: da-ui
    jira_title: Destination account (UI)
    summary: >-
      Create destination account via platform UI. Textual runbook today; REST
      API when platform team ships it.
    depends_on: [ig-ui]
    repos: [agent-demo]

  - id: redpanda-topics
    skill: redpanda-topics
    jira_title: Redpanda topics
    summary: >-
      Topic design; emit artifacts/redpanda-topics.yaml. Live topic creation
      only if user explicitly asks.
    depends_on: [transposer-record-handler]
    repos: [agent-demo]

  - id: grafana-dashboards
    skill: grafana-dashboards
    jira_title: Grafana dashboards and alerts
    summary: >-
      Dashboards and alerts — needs RLG id and metric names from prior steps.
    depends_on: [rlg-addition, transposer-record-handler, taxonomy-deliverer]
    repos: [agent-demo]

  - id: tech-discovery
    skill: tech-discovery
    jira_title: Tech Discovery (Confluence)
    summary: >-
      Confluence Tech Discovery draft for QA — not the test plan.
    depends_on: [grafana-dashboards, transposer-record-handler]
    repos: [agent-demo]

presets:
  all:
    - release-ticket
    - dist-types
    - oauth
    - taxonomy-deliverer
    - partner-api-client
    - request-builder-sender
    - transposer-record-handler
    - rlg-addition
    - delivery-endpoints-ui
    - taxonomy-ui
    - ig-ui
    - da-ui
    - redpanda-topics
    - grafana-dashboards
    - tech-discovery
  implementation:
    - release-ticket
    - dist-types
    - oauth
    - taxonomy-deliverer
    - partner-api-client
    - request-builder-sender
    - transposer-record-handler
    - rlg-addition
    - delivery-endpoints-ui
    - taxonomy-ui
    - ig-ui
    - da-ui
    - redpanda-topics
  minimal:
    - release-ticket
    - dist-types
    - oauth
